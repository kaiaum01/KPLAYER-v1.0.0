name: Compilar KPlayer Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Localizar o projeto Android
        id: project
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle Wrapper não encontrado."
            exit 1
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Permitir execução do Gradle Wrapper
        shell: bash
        run: chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      - name: Compilar APK Debug
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Preparar APK
        id: apk
        shell: bash
        run: |
          SOURCE="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          TARGET="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/KPlayer-Android-Beta.apk"
          test -f "$SOURCE"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Disponibilizar APK nos artefatos
        uses: actions/upload-artifact@v7
        with:
          name: KPlayer-Android-Beta-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Anexar APK à Release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "KPlayer Android ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --clobber
